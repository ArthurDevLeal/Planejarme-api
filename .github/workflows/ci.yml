name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Sem banco no CI: os testes que precisam dele ficam pulados (RUN_DB_TESTS não é definido).
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
